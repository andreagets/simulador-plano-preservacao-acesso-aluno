:root{--navy:#10283D;--teal:#087F79;--gold:#F4BC59;--mint:#DFF7ED}*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:var(--navy);font:16px/1.55 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #b8ccce;border-radius:8px;background:white;color:var(--navy);padding:10px 16px}button:hover{background:var(--mint)}button.primary{background:#086D69;color:white;border-color:#086D69}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:3px solid #EDAA39;outline-offset:3px}header{background:var(--navy);color:white;display:flex;justify-content:space-between;align-items:center;padding:18px 4%;gap:20px}header small{color:#bcd6dd}header button{background:transparent;color:white}h1{font-size:clamp(26px,4vw,38px);line-height:1.2;margin:8px 0 16px}h2{font-size:23px}h3{font-size:18px}p{margin:10px 0}main{max-width:1340px;padding:30px 4%;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:700;color:var(--teal)}.card{background:white;border:1px solid #dce5e6;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 3px 12px #10283d04}.hero{background:var(--navy);color:white;padding:36px;border-radius:18px;margin-bottom:24px;position:relative;overflow:hidden}.hero .eyebrow{color:#a7e0d3}.hero p{max-width:690px;color:#d0dfe5}.hero:after{content:'06';position:absolute;right:35px;top:10px;font-size:150px;font-weight:800;color:#ffffff0b;pointer-events:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric strong{font-size:34px;display:block}.metric{background:white;border:1px solid #dce5e6;padding:20px;border-radius:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:#526875;font-size:14px}.notice{background:#fff5de;padding:14px 18px;border-left:4px solid var(--gold);margin:15px 0;border-radius:4px}.success{background:var(--mint);padding:12px;border-radius:7px}.tag{display:inline-block;font-size:12px;font-weight:650;line-height:1.5;padding:4px 9px;border-radius:30px;background:#e7f0f2;color:#10283D;margin:3px}.hero .tag{background:#DFF7ED;color:#10283D;font-weight:700}.layout{display:grid;grid-template-columns:245px 1fr;gap:25px}.steps button{display:block;width:100%;text-align:left;margin:8px 0}.steps .active{background:var(--teal);color:white}.steps{position:sticky;top:15px;align-self:start}label{display:block;font-weight:600;margin:16px 0 5px}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #b7c9cc;border-radius:7px;padding:10px;background:white;color:var(--navy)}textarea{min-height:95px;resize:vertical}input[type=checkbox]{width:19px;height:19px;vertical-align:middle}label.inline{font-weight:400;display:flex;gap:10px}.bar{height:10px;background:#e4edee;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}details{background:#f2f7f7;padding:13px;border-radius:8px;margin:12px 0}summary{cursor:pointer;font-weight:600}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #dce5e6}th{font-size:13px;color:#526875}.scroll{overflow:auto}.danger{color:#a42d26}.score{font-size:36px;font-weight:750}.casebody{white-space:pre-wrap;font-size:15px}footer{max-width:1250px;margin:25px auto;padding:20px 4%;border-top:1px solid #dce5e6;font-size:13px;color:#526875}#toast{position:fixed;bottom:25px;right:25px;background:#10283d;color:white;max-width:90%;padding:15px 22px;border-radius:10px;z-index:100;display:none}dialog{border:0;border-radius:15px;max-width:800px;width:95%;max-height:90vh;overflow:auto;padding:28px}dialog::backdrop{background:#10283d99}.plan p{white-space:pre-wrap}.plan h2{border-bottom:2px solid #087f79;padding-bottom:8px}.plan{overflow-wrap:anywhere}.printonly{display:none}@media(max-width:760px){.layout{display:block}.steps{position:st const CASES=[{"id":1,"title":"O material complementar que o catálogo não alcança","body":"*Adaptação do caso 4.2.1 (University of Washington).*\nContexto: biblioteca central de uma universidade; o catálogo descreve teses e dissertações de 1998–2012, mas os **materiais complementares** (bases de dados, planilhas, mapas, áudios de campo) ficaram em **disquetes e CD-R** guardados em caixa, sem item no acervo físico e sem cópia no repositório institucional.\nDisparador: um pesquisador pede um dataset citado numa tese; a biblioteca percebe que não sabe sequer quantas mídias existem.\nRoteiro: *Ato 1 — Inventário e registro* (levantar, identificar e estabilizar antes de tentar ler; criar o registro do ativo digital) → *Ato 2 — Leitura protegida* (imagem de disco e bloqueador de escrita; o original não é o meio de trabalho) → *Ato 3 — Scorecard e priorização* (evidências e perfil de risco técnico × demanda, unicidade e valor institucional; justificar o que atender primeiro) → *Ato 4 — Reingresso no sistema de informação* (relacionar o material à tese-mãe — empacotamento/descrição tipo METS —, gerar master e derivado de acesso e depositar no repositório, com metadados de preservação).\nTensão: **representação × conteúdo** — o registro bibliográfico existia e estava correto; o objeto, nas camadas física e lógica, estava perdido. Preservar, aqui, é também *voltar a representar* o que se preserva.\nErro esperado: tentar “abrir os arquivos para ver o que é” direto da mídia original."},{"id":2,"title":"Preservar em escala sem perder o contexto","body":"*Adaptação do caso 4.2.2 (National Library of Australia).*\nContexto: centro de documentação/memória com milhares de itens digitais em suportes físicos heterogêneos — publicações oficiais em CD, manuscritos nato-digitais de pesquisadores, fotografias em mídias removíveis — e equipe pequena.\nDisparador: a direção cobra um fluxo, não um mutirão: o acervo continua crescendo.\nRoteiro: *Ato 1 — Escopo e triagem* (nem tudo entra com o mesmo tratamento: política de aquisição/seleção) → *Ato 2 — Fluxo semiautomatizado* (estabilizar → imagem/cópia verificada → identificação de formato → ingestão, com fila por prioridade do scorecard) → *Ato 3 — Documentação do processo* (cada transformação registrada — trilha que sustenta autenticidade em escala) → *Ato 4 — Revisão do fluxo* (o que o fluxo faz com os itens que fogem ao padrão: mídia ilegível, conteúdo sigiloso, formato desconhecido).\nTensão: **escala × proveniência** — automatizar sem registrar contexto produz cópias íntegras de objetos que já não se sabe o que são.\nErro esperado: propor “migrar tudo, na ordem da estante”."},{"id":3,"title":"O arquivo pessoal híbrido de uma escritora","body":"*Caso ilustrativo da disciplina (arquivos pessoais / memória).*\nContexto: fundo pessoal doado a um arquivo universitário — cadernos e cartas em papel ao lado de disquetes, HD externo e uma conta de e-mail com rascunhos, versões e correspondência com editores.\nDisparador: pesquisadores pedem acesso; parte do material está sob restrição da doadora e há dados pessoais de terceiros.\nRoteiro: *Ato 1 — Avaliação arquivística* (o que é documento do fundo, o que é duplicata/ruído; ordem e contexto de produção importam) → *Ato 2 — Extração forense com sigilo* (imagem integral, cadeia de custódia, triagem de conteúdo restrito antes de qualquer acesso) → *Ato 3 — Destino dos suportes* (o HD da escritora tem valor por associação? artefato × acesso, seção 2.3) → *Ato 4 — Acesso graduado* (o plano separa master de preservação, cópia de consulta e itens embargados — preservar não é publicar).\nTensão: **autenticidade × privacidade** — a mesma técnica (forense) que garante a integridade é a que permite *não* expor o que deve continuar restrito.\nErro esperado: tratar o fundo digital como “pasta de arquivos” e perder o vínculo com o todo documental."},{"id":4,"title":"História oral sem aparelho para ouvir","body":"*Caso ilustrativo da disciplina (conteúdo sonoro/audiovisual).*\nContexto: núcleo de memória mantém entrevistas de história oral gravadas em fitas magnéticas e, depois, em vídeo digital proprietário; o último equipamento de reprodução compatível saiu de uso e as entrevistas são fonte primária de pesquisas em curso.\nDisparador: uma entrevista é requisitada para uma tese e não há como reproduzi-la na instituição.\nRoteiro: *Ato 1 — Diagnóstico em três camadas* (física: suporte magnético; lógica: formato/codec; conceitual: voz, sincronia e contexto da entrevista — termo de cessão e ficha da entrevista fazem parte do objeto) → *Ato 2 — Scorecard* (avaliar longevidade e obsolescência separadamente, com evidências; interpretar por que a ausência de leitor exige ação específica) → *Ato 3 — Estratégia de conversão* (master sonoro sem perda — BWF/WAV — e audiovisual em codec aberto, com derivado leve de acesso, conforme a matriz da seção 6) → *Ato 4 — Representação* (a entrevista migrada sem sua ficha, seu termo e sua transcrição volta a ser “arquivo solto”: o plano exige o pacote completo).\nTensão: **conteúdo × contexto de produção** — em história oral, metadado e consentimento são constitutivos do objeto, não acessórios.\nErro esperado: converter para MP3/MP4 de acesso e descartar o master."},{"id":5,"title":"Nascer preservável: o laboratório de digitalização","body":"*Caso ilustrativo da disciplina — o eixo **produção** do nome da disciplina.*\nContexto: biblioteca está digitalizando uma hemeroteca (jornais e fotografias). A produção é boa visualmente, mas os masters se acumulam num único HD externo, os nomes de arquivo variam por operador, não há checksum na captura e o “backup” é uma cópia manual quando alguém lembra.\nDisparador: a coordenação pede que a coleção digital entre no repositório institucional — e ninguém consegue provar a integridade dos masters já produzidos.\nRoteiro: *Ato 1 — Diagnóstico retroativo* (o que dá para verificar e documentar do que já foi produzido; o que precisa ser redigitalizado e por quê) → *Ato 2 — Desenho do fluxo de produção preservável* (formato master × formato de acesso, nomeação, metadados na captura, fixidez no ato, destino imediato em armazenamento gerenciado e multicópias) → *Ato 3 — Scorecard didático contextualizado à produção* (aplicar os seis critérios por analogia explícita, com evidências e confiança: que dependências de armazenamento, integridade e interpretabilidade estamos criando hoje?) → *Ato 4 — Política* (transformar o fluxo em norma interna da unidade, com responsáveis).\nTensão: **produzir × preservar não são fases, são o mesmo ato** — cada decisão de produção é uma decisão de preservação tomada por antecedência ou por omissão.\nErro esperado: propor “resolver depois, quando o repositório estiver pronto”."},{"id":6,"title":"Os dados de pesquisa que ninguém mais abre","body":"*Caso ilustrativo da disciplina (dados científicos / repositório de dados).*\nContexto: grupo de pesquisa em Ciência da Informação deposita, ao fim de um projeto, planilhas com macros, uma base de dados em software proprietário descontinuado, questionários e o dicionário de variáveis — espalhados em pen drives e pastas pessoais dos bolsistas.\nDisparador: a agência de fomento e a política institucional exigem disponibilidade e reprodutibilidade; outra equipe quer reutilizar os dados.\nRoteiro: *Ato 1 — O que é o objeto?* (dados sem dicionário, instrumento e documentação do desenho da pesquisa não são reutilizáveis — camada conceitual) → *Ato 2 — Normalização* (planilhas para ODS/CSV, base para formato aberto/encapsulado tipo SIARD com seu esquema, conforme a seção 6) → *Ato 3 — Integridade e proveniência* (quem produziu, em que versão, com que transformações — registro PREMIS) → *Ato 4 — Comunidade designada e acesso* (quem reutiliza, em que formatos de disseminação, com que restrições éticas/de sigilo dos respondentes).\nTensão: **abrir × compreender** — disponibilidade sem documentação é acesso sem inteligibilidade; o plano preserva o *pacote informacional*, não arquivos isolados.\nErro esperado: publicar as planilhas originais num drive compartilhado e chamar isso de preservação."},{"id":7,"title":"A unidade que vai começar: o primeiro plano institucional","body":"*Adaptação do caso 4.2.3 (Digital Preservation Planning Case Study, DPC) — caso-síntese/capstone.*\nContexto: uma unidade de informação (biblioteca, arquivo ou centro de memória) sem nenhuma política de preservação digital recebe a incumbência de apresentar um plano à direção em 90 dias — e o aluno usa, combinados, fragmentos dos casos 1–6 como o “acervo real” da unidade.\nRoteiro: *Ato 1 — Escopo* (o que entra no plano e o que fica explicitamente fora) → *Ato 2 — Avaliação de risco e priorização da coleção* (scorecard aplicado à fila inteira, separando risco técnico de prioridade institucional e sinalizando avaliações incompletas) → *Ato 3 — Papéis e responsabilidades* (profissional da informação, produtores, TI, direção — quem monitora tecnologia e comunidade designada) → *Ato 4 — Plano e gatilhos* (o documento final, com cronograma por gatilhos e revisão periódica, no formato da Etapa 6).\nTensão: **plano × programa** — um plano pontual envelhece; o que se institui é um programa de monitoramento contínuo (OAIS).\nErro esperado: entregar um plano de migração única, sem monitoramento nem responsáveis."},{"id":8,"title":"Game sério mobile: o jogo que a loja pode apagar","body":"*Caso de produção da disciplina (software/aplicativo).*\nContexto: equipe de um programa de pós-graduação desenvolve um **game sério em aplicativo mobile** (ex.: jogo sobre letramento informacional para calouros) com um motor de jogo proprietário, ativos produzidos por bolsistas e publicação prevista nas lojas de aplicativos.\nDisparador: na reunião de lançamento, alguém pergunta: “se a loja remover o app, se o motor mudar a licença ou se o sistema operacional abandonar a arquitetura — o que sobra do jogo daqui a dez anos?”\nRoteiro: *Ato 1 — O que é o objeto?* (o instalável não é o objeto inteiro: código-fonte, projeto do motor, ativos — arte, áudio, roteiros/textos, dados de fases —, regras/mecânicas e documentação de design formam o pacote; a camada conceitual aqui é o **comportamento**) → *Ato 2 — Scorecard das escolhas de produção* (dependência de motor proprietário × componentes abertos; dependência de serviços externos/servidor; loja como canal único × distribuição alternativa) → *Ato 3 — Pacote de preservação na entrega* (fontes versionadas + build documentado + lista de dependências e licenças de terceiros + registro em vídeo do jogo em execução como representação de referência) → *Ato 4 — Estratégia de futuro* (migração de motor × emulação de ambiente × encapsulamento; quem monitora os gatilhos: nova versão do SO, fim de suporte do motor, política da loja).\nTensão: **produto × processo** — publicar o app é distribuir um executável; preservar o game é preservar a capacidade de **reconstruí-lo e compreendê-lo**.\nErro esperado: guardar só o arquivo instalável (APK/AAB) e a página da loja como “acervo”."},{"id":9,"title":"E-book: o livro que é arquivo, fonte e plataforma","body":"*Caso de produção da disciplina (textual/digital editorial).*\nContexto: uma editora universitária / grupo de pesquisa vai publicar um **e-book** de uma obra coletiva da área: capítulos em editores de texto variados, imagens de terceiros, previsão de venda/leitura em plataformas comerciais com DRM e de depósito na biblioteca.\nDisparador: a biblioteca pergunta qual arquivo, exatamente, ela vai preservar — o arquivo da plataforma de venda?\nRoteiro: *Ato 1 — Separar as camadas da obra* (texto-fonte estruturado × arquivo de leitura — EPUB — × versão fixa — PDF/A — × plataforma/DRM: o que a instituição detém, de fato?) → *Ato 2 — Decisões editoriais preserváveis* (estrutura semântica e acessibilidade do EPUB, metadados bibliográficos completos, licenças das imagens registradas, identificadores) → *Ato 3 — Pacote de preservação editorial* (fontes + EPUB sem DRM para preservação + PDF/A + ficha de produção: quem fez o quê, em que ferramentas e versões) → *Ato 4 — Depósito e acesso* (master no repositório/biblioteca, disseminação pelas plataformas — sem confundir canal de venda com acervo).\nTensão: **circulação × custódia** — quanto mais o e-book depende da plataforma para existir, menos a instituição é dona do seu futuro.\nErro esperado: eleger o arquivo com DRM, tal como sai da loja, como “o” arquivo de preservação."},{"id":10,"title":"Podcast educacional: a série que vive no feed","body":"*Caso de produção da disciplina (sonoro).*\nContexto: uma disciplina/projeto de extensão produz um **podcast educacional em áudio**: episódios gravados em celulares e editados em software proprietário, publicados via agregador comercial (feed RSS) e divulgados em plataformas de streaming.\nDisparador: ao fim do projeto financiado, a conta do agregador vence — e com ela podem ir embora feed, descrições e estatísticas; os áudios brutos estão nos aparelhos dos bolsistas.\nRoteiro: *Ato 1 — Anatomia do episódio* (áudio bruto × projeto de edição × episódio final × roteiro/transcrição × arte e metadados do feed: o episódio é um pacote, não um MP3) → *Ato 2 — Master × disseminação* (master sonoro sem perda — WAV/BWF — e derivado de acesso — MP3/AAC —, conforme a matriz da seção 6; o MP3 do streaming não é master) → *Ato 3 — O feed também é documento* (exportar e guardar metadados, descrições, roteiros e transcrições — acessibilidade e representação temática vivem aí) → *Ato 4 — Custódia pós-projeto* (quem recebe o pacote quando a equipe se dispersa: repositório/biblioteca, com direitos e consentimentos dos participantes registrados).\nTensão: **audiência × memória** — a plataforma otimiza alcance hoje; o plano garante inteligibilidade amanhã, inclusive para quem não pode (ou não quer) ouvir: transcrição é preservação e é acesso.\nErro esperado: considerar preservado o que está “no Spotify” e descartar brutos e projetos de edição ao trocar de celular."},{"id":11,"title":"Infográfico interativo: a página que depende de tudo","body":"*Caso de produção da disciplina (web & software / representação visual da informação).*\nContexto: estudantes criam um **infográfico interativo** em HTML/CSS/JavaScript com bibliotecas externas via CDN, dados vindos de uma planilha viva e gráficos gerados por uma ferramenta online; será publicado numa página do curso e usado como recurso educacional.\nDisparador: no semestre seguinte, um link de biblioteca muda, a planilha-fonte é editada e o infográfico “quebra” silenciosamente — continua no ar, mas já não mostra o que mostrava.\nRoteiro: *Ato 1 — Mapear as dependências* (código próprio × bibliotecas de terceiros × dados-fonte × serviços externos: tudo o que precisa existir para o infográfico ser ele mesmo — camada lógica exposta) → *Ato 2 — Congelar a evidência* (pacote com código + dados-fonte datados (CSV) + bibliotecas incorporadas localmente, sem depender de CDN, + captura/representação estática de referência do resultado esperado) → *Ato 3 — Documentar a leitura* (fontes dos dados, decisões de representação visual e de interação — o porquê dos gráficos é parte do objeto informacional) → *Ato 4 — Versionar e depositar* (versão publicada × versão de trabalho; depósito do pacote autocontido no acervo da disciplina/repositório, com captura em WARC como registro da experiência publicada).\nTensão: **interatividade × estabilidade** — o valor do objeto está no comportamento; sua fragilidade também. Preservar é tornar as dependências explícitas e, quando possível, internas ao pacote.\nErro esperado: guardar um print (ou o link) como se fosse o infográfico — print é representação, não o objeto; link é endereço, não custódia.\n*Nota de metalinguagem para a turma:* esta edição inteira, incluindo turmas e ranking, é autocontida. No Caso 11, analisar também como preservar o HTML, as bibliotecas incorporadas, os esquemas de dados e os backups exportados, distinguindo aplicação de registros de uso."}];
const CRITERIA=[["Longevidade","Evidência consistente de boa conservação e estabilidade","Condições estáveis com verificações recentes","Histórico parcial ou sinais iniciais de fragilidade","Degradação documentada ou estabilidade comprometida","Deterioração severa comprovada ou risco iminente ao conteúdo"],["Capacidade","Capacidade adequada e com margem operacional","Adequada com limitações pequenas","Expansão ou fragmentação dificulta a gestão","Insuficiência relevante compromete o fluxo","Incapacidade comprovada de acomodar/proteger o acervo previsto"],["Viabilidade","Integridade verificável; leitura/recuperação e proteção disponíveis","Controles funcionais, com lacunas menores","Controles parcialmente documentados","Erros relevantes ou capacidade de recuperação comprometida","Integridade/recuperação criticamente comprometida, com evidência"],["Obsolescência","Leitores, sistemas e especificações disponíveis e sustentáveis","Dependência controlada de tecnologia mantida","Suporte irregular ou compatibilidade reduzida","Leitura dependente de tecnologia rara ou descontinuada","Inexistência comprovada de via operacional de acesso comum"],["Custo","Manutenção viável e suportada por recursos existentes","Custos administráveis com pequenas restrições","Custos demandam replanejamento","Custos altos comprometem continuidade","Custos inviabilizam comprovadamente a solução atual"],["Suscetibilidade","Ambiente e proteção adequados, sem dano identificado","Vulnerabilidades menores controladas","Exposição ou fragilidade requer correção","Condições adversas com impacto relevante","Dano/condições críticas com ameaça imediata identificada"]];
const MATRIX="| Tipologia (módulo 4 da Nota de Aula) | Exemplos nos roteiros | Formato master (preservação) | Formato de disseminação | Risco | Estratégia primária | Propriedades significativas a declarar |\n|---|---|---|---|---|---|---|\n| **Textual** — documentos | Teses e materiais complementares (Caso 1); **e-book (Caso 9)**; atas e ofícios (exemplo-relâmpago) | PDF/A, XML; no e-book: fontes estruturadas + EPUB sem DRM como arquivo de guarda | PDF web, HTML; EPUB/PDF de leitura nas plataformas | Baixo — sobe com DRM/plataforma | Migração / normalização | Conteúdo, estrutura, autoria e contexto; formatação quando evidencial; no e-book, estrutura semântica e acessibilidade |\n| **Iconográfico** — imagens estáticas | Fotografias da hemeroteca (Caso 5) e de eventos (exemplo-relâmpago) | TIFF 6.0 não comprimido, DNG | JPEG, WebP | Baixo | Refrescamento / migração | Resolução, profundidade de cor, fidelidade visual |\n| **Sonoro** — documentos sonoros | Entrevistas de história oral (Caso 4); **podcast educacional (Caso 10)** | BWF 24 bits/96 kHz, WAV L-PCM (+ projeto de edição e roteiro/transcrição, no podcast) | MP3, AAC | Médio (volume) | Refrescamento de suporte | Fidelidade sonora, duração, canais — e ficha/consentimento (história oral) e metadados do feed/transcrição (podcast) como parte do objeto |\n| **Audiovisual** — recursos audiovisuais | Vídeos institucionais e de sessões (Caso 4) | FFV1/Matroska (MKV), MXF | MP4 (H.264/AAC), WebM | Alto (codecs) | Migração para codecs abertos | Imagem e som sincronizados, codec, taxa de quadros |\n| **Pesquisa / Dados** — planilhas, bases e datasets | Dados do grupo de pesquisa (Caso 6); planilhas das teses (Caso 1) | ODS e CSV UTF-8 (planilhas); CSV, JSON-Schema, SIARD (bases) | XLSX/PDF; API JSON, Excel | Médio (macros; esquema) | Normalização; encapsulamento com dicionário | Valores, fórmulas/relações, esquema — e a documentação que torna o dado inteligível |\n| **Web & Software** — conteúdos web e ambientes | **Game sério mobile (Caso 8)**; **infográfico interativo (Caso 11)**; portal a descontinuar e CD-ROM multimídia (exemplos-relâmpago) | WARC (ISO 28500); imagem de disco/contêiner; no game: fontes + projeto do motor + ativos + build documentado; no infográfico: pacote autocontido (código + dados-fonte + bibliotecas locais) | Replay tipo Wayback; emulador web; lojas de aplicativo e página publicada são só disseminação | Alto (dinamismo) a crítico (hardware, motor, loja) | Arquivamento web; emulação + encapsulamento | Interatividade, links e aparência em contexto; **comportamento** em execução; dependências declaradas |\n\n";
const REFS="## 7. Referências do blueprint\n\n- BROWN, Adrian. *Selecting storage media for long-term preservation*. Digital Preservation Guidance Note 2, issue 2. The National Archives, ago. 2008. **Texto integral conferido, especialmente seção 3, p. 6:** https://cdn.nationalarchives.gov.uk/documents/information-management/selecting-storage-media.pdf . O scorecard original utiliza escala de adequação 1–3 e soma dos seis critérios; Brown atribui o conceito a Bennett (1997).\n- BENNETT, J. C. *A framework of data types and formats, and issues affecting the long-term preservation of digital material*. JISC/NPO studies on the preservation of electronic materials. British Library Research and Innovation Report 50, 1997. **Referência bibliográfica citada por Brown (2008), não consultada diretamente nesta revisão.**\n- HARVEY, R. *Preserving Digital Materials*. 2. ed. De Gruyter Saur, 2011.\n- DIGITAL PRESERVATION COALITION. *Digital Preservation Handbook* — seções *Legacy media*, *Storage*, *Digital forensics*, *Preservation planning*, *Preservation action*, *Acquisition and appraisal*, *File formats and standards*. https://www.dpconline.org/handbook\n- CCSDS. *Reference Model for an Open Archival Information System (OAIS)* (ISO 14721) — funções Monitorar Tecnologia e Monitorar Comunidade Designada, via *Preservation planning*.\n- NDSA. *Levels of Digital Preservation* — régua de armazenamento multicópias, via *Storage*.\n\n---\n\n\n\n- SILVA, Andréa Soares Rocha da. Preservação de Longo Prazo de Conteúdos Digitais. [S. l.]: autora, 2026. Recurso educacional interativo (HTML5). https://andreagets.github.io/red-interativo-preservacao-longo-prazo-conte-do-digital/ . Material de apoio para o preenchimento; módulos 1–5.\n";

const FIELD_GUIDES={"title":["Dê um nome que delimite o conjunto ou projeto. Identifique o conteúdo e o contexto, sem confundir o título com o nome do arquivo.","Entrevistas de história oral do Núcleo de Memória — coleção 2001–2010.",2,"2.1 — Fixação dos Limites do Objeto; 2.2 — Preservar o contexto"],"type":["Informe a tipologia do conteúdo e, separadamente, o suporte ou ambiente em que ele está. Um mesmo suporte pode conter diferentes tipologias.","Sonoro: entrevistas em fitas; textual: fichas e transcrições em arquivos digitais.",4,"4 — Aplicação por Tipologia; complementar em 1.1 — Três Camadas"],"volume":["Registre quantidade, tamanho, período e versões conhecidos. Se o roteiro não informar, escreva “não informado” e indique como levantar o dado. Não invente quantidades.","Quantidade ainda não inventariada; levantar número de mídias, tamanho total e datas na triagem.",2,"2.1 — Limites do Objeto; 2.2 — Contexto"],"producer":["Identifique quem produziu o conteúdo, em qual atividade e como chegou à custódia atual. Diferencie produtor, proprietário e custodiante.","Entrevistas produzidas pelo projeto de extensão; custodiadas pelo núcleo de memória, com termos de cessão a conferir.",2,"2.2 — Preservar o Contexto e Registrar a Proveniência"],"community":["Descreva quem precisará compreender e usar o conteúdo, seus conhecimentos e necessidades de acesso. Comunidade designada não é apenas uma lista de nomes.","Pesquisadores de história oral, que precisam de áudio inteligível, ficha contextual e transcrição.",5,"5.1 — OAIS; no diagrama, Comunidade Designada e Acesso"],"value":["Explique valor informacional/evidencial, possível unicidade e demanda. Diferencie fato informado de hipótese a confirmar; esse juízo não entra automaticamente na média do scorecard.","Há pedido para uma tese; verificar se existe outra cópia e qual é o valor documental da entrevista.",2,"2.1 — Conteúdo, Autenticidade e Contexto; 2.2 — Política institucional"],"metadata":["Liste informações descritivas, técnicas e de preservação existentes e ausentes. Diga como os arquivos se relacionam entre si.","Existem ficha e termo; faltam identificador persistente, formato/codec e histórico de intervenções.",5,"5.2 — PREMIS e METS"],"restrictions":["Registre direitos, consentimentos, dados pessoais e limites de acesso conhecidos. Quando houver dúvida, indique a verificação necessária, sem inventar autorização.","Acesso condicionado ao termo de cessão; revisar dados de terceiros antes de produzir cópia de consulta.",3,"3.1 — Conformidade legal; complementar em 5.2 — Direitos (PREMIS)"],"physical":["Descreva suporte, condições observadas, ambiente e equipamentos. Cite a evidência e não afirme dano sem informação no caso.","O equipamento compatível saiu de uso; o estado da fita ainda exige inspeção por profissional habilitado.",1,"1.1 — Camada Física"],"logical":["Mapeie formatos, codecs, programas, versões e serviços necessários à leitura. Nos casos de produção, liste também bibliotecas, motor, CDN e dados externos.","O vídeo usa codec proprietário; identificar versão e testar reprodução em cópia de trabalho.",1,"1.1 — Camadas Lógica e Conceitual"],"safe":["Descreva cuidados antes da leitura: pessoas autorizadas, cópia de trabalho, proteção contra alteração e registro de manuseio. Não descreva publicação nesta etapa.","Manter original sob custódia; usar cópia protegida e restringir a inspeção à equipe autorizada.",1,"1.2 — Autenticidade, Integridade e Custódia; 3.1 — Conformidade legal"],"reading":["Registre se a leitura foi informada como possível, com erros, impossível ou desconhecida; indique a ação seguinte. O simulador não examina mídias reais.","Leitura desconhecida; planejar captura protegida e verificar equipamento antes de tentar abrir arquivos.",3,"3.2 — Arqueologia Digital e Conservação de Tecnologia"],"priority":["Articule problema, evidência, urgência, recursos e valor institucional. Nomeie uma providência adequada; índice alto não implica sempre migrar imediatamente.","Sem via comum de leitura, investigar recuperação especializada antes de planejar a transferência do conteúdo.",3,"3.1 — Base Institucional; 3.3 — Decisão Estratégica (fundamentação contextual, não fórmula do scorecard)"],"order":["Se comparar acervos, escreva uma ordem justificada por demanda, unicidade, risco e recursos. Nos demais modos, explique a prioridade interna ou registre “não se aplica” com motivo.","Atender primeiro o conjunto único solicitado; manter em fila de diagnóstico itens cujo risco não pôde ser avaliado.",2,"2.2 — Política institucional; complementar em 3.3 — Decisão Estratégica"],"object":["Delimite o que será preservado além do suporte: arquivos, relações, contexto, comportamento e documentação necessários à compreensão.","Entrevista + ficha + consentimento + transcrição + metadados, preservando sua relação documental.",1,"1.1 — Três Camadas; complementar em 2.1 — Limites do Objeto"],"properties":["Liste características que precisam sobreviver e como verificá-las após uma transformação. Escolha conforme o conteúdo; não copie uma lista universal.","Voz inteligível, duração, canais e sincronismo; comparar amostra e duração antes/depois da conversão.",2,"2.1 — Conteúdo, Apresentação e Funcionalidade; complementar em módulo 4"],"master":["Escolha versão de guarda e justifique formato, propriedades e validação. Preserve fontes e originais quando necessários; não basta converter a extensão.","Master sonoro sem perda em WAV/BWF, com arquivos de origem e parâmetros de captura documentados.",4,"4 — Tabela: Formato Master (Preservação); 3.2 — Migração"],"access":["Escolha derivado adequado ao usuário e à distribuição. Identifique perdas aceitáveis e deixe claro que a cópia de consulta não substitui o master.","MP3 para consulta e transcrição textual autorizada; manter master sem perda em custódia.",4,"4 — Tabela: Disseminação; complementar em 5.1 — Acesso/DIP"],"package":["Liste conteúdo e informações que devem acompanhar o objeto: fontes, metadados, direitos, dependências, manifestos e documentação. Não é apenas compactar uma pasta.","Master, derivado, ficha, termo, transcrição, manifesto e registro da captura em um pacote identificado.",5,"5.1 — SIP, AIP e DIP; 5.2 — PREMIS e METS"],"policy":["Decida quem acessa o quê e quando; descreva embargo, anonimização de derivados e registro das transformações. Distinga guarda de publicação.","Master restrito; cópia autorizada para consulta; anonimização documentada somente no derivado.",3,"3.1 — Conformidade legal; 5.2 — Direitos e Eventos (PREMIS)"],"storage":["Descreva a transferência para custódia gerenciada: destino, responsável, permissões, validação e continuidade. Uma pasta compartilhada isolada não constitui programa de preservação.","Ingerir pacote validado em custódia institucional, registrar aceite e definir responsável pela recuperação.",5,"5.1 — Ingestão e Armazenamento Arquivístico; 5.3 — Infraestruturas"],"strategy":["Escolha ação complementar conforme dependências e propriedades. Explique por que migrar, emular, recuperar ou manter ambiente; registre limites e validação.","Investigar recuperação especializada; após captura, gerar master e derivado e validar propriedades.",3,"3.2 — Migração, Emulação, Conservação de Tecnologia e Arqueologia Digital"],"original":["Justifique retenção ou destinação do suporte/versão original após captura validada. Considere valor de artefato e evidência; não determine descarte automático.","Reter fita identificada até validar captura e concluir avaliação de valor documental.",3,"3.2 — Conservação de Tecnologia; complementar em 1.2 — Custódia"],"copies":["Informe número de cópias, independência, locais e modalidade online/offline. Explique como evitar falha simultânea; quantidade sozinha não garante segurança.","Proposta didática: três cópias em domínios de falha diferentes, uma geograficamente separada e uma offline.",5,"5.3 — LOCKSS; complementar em 2.2 — Recuperação (número de cópias é decisão contextual)"],"fixity":["Defina método de verificação, momentos, periodicidade, responsável e resposta a divergências. Hash não comprova sozinho autenticidade nem integridade anterior à sua geração.","Gerar SHA-256 na ingestão e verificar após transferência; divergência exige isolamento, investigação e restauração verificada.",1,"1.2 — Integridade e Fixidez; referência complementar “Fixidez e checksums”, no módulo 7"],"tradeoff":["Compare custos relativos, competências, dependências e riscos que permanecem. Declare que estimativas são ilustrativas quando não houver orçamento real.","Recuperação especializada: esforço inicial alto, a orçar; risco residual de perda de contexto controlado por documentação.",3,"3.1 — Gestão de Custos; 3.2 — Vantagens e Riscos das Estratégias"],"summary":["Sintetize problema, objetivo, ações e ordem de execução. Distingua ações propostas das já executadas; o bloco A deve resumir as decisões anteriores.","Inventariar, proteger, diagnosticar, capturar, validar, constituir pacote e transferir a custódia.",2,"2.2 — Política e Princípios; complementar em 3.1 — Base Institucional"],"responsible":["Atribua papéis e decisões: quem coordena, executa, aprova e monitora. Se nomes não existirem, use funções e indique que a designação está pendente.","Curadoria seleciona e descreve; TI captura e verifica; direção aprova recursos; responsável da coleção monitora necessidades.",5,"5.1 — Funções do OAIS; complementar em 2.2 — Responsabilidades"],"resources":["Liste infraestrutura, ferramentas, pessoas, competências e recursos financeiros necessários. Identifique disponibilidade ou necessidade de aprovação.","Estação compatível, armazenamento gerenciado, tempo de curadoria e orçamento para serviço especializado a aprovar.",3,"3.1 — Estratégias Estruturais e Gestão de Custos"],"schedule":["Associe ação a prazo, pré-condição ou gatilho. Datas e frequências escolhidas são propostas contextuais, não durabilidades garantidas pelas fontes.","Executar piloto após diagnóstico e aprovação de recursos; antecipar captura se inspeção indicar ameaça demonstrada.",3,"3.1 — Planejamento institucional; complementar em 5.1 — Planejamento da Preservação"],"triggers":["Liste mudanças que exigem reavaliar o plano e qual resposta desencadeiam. Inclua tecnologia, integridade, direitos e necessidades da comunidade.","Fim de suporte do codec → avaliar alternativa e testar propriedades; divergência de hash → investigar antes de restaurar.",5,"5.1 — No diagrama, Planejamento da Preservação e Comunidade Designada"],"monitor":["Defina o que verificar, quem verifica, frequência, registro e data de revisão. Não encerre o plano após uma migração única.","TI verifica cópias conforme política; curadoria revê dependências e necessidades; registrar evidência, decisão e próxima revisão.",5,"5.1 — Planejamento da Preservação; 5.3 — Verificações distribuídas"]};

const APP="preserva-local",SCHEMA=1,DB_NAME="preserva-aluno-local-v1";
let db,mem=false,state={schemaVersion:1,revision:0,config:{teacher:'',institution:'',course:'',className:''},students:[],rounds:[],attempts:[],imports:[]},view='home',studentId=null,attemptId=null,step=0,saveQueue=Promise.resolve(),seen=0,guideCounter=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?crypto.randomUUID():'p'+Date.now()+Math.random().toString(36).slice(2),now=()=>new Date().toISOString(),current=()=>state.attempts.find(a=>a.id===attemptId),round=a=>state.rounds.find(r=>r.id===a.roundId),student=a=>state.students.find(s=>s.id===a.studentId),caseOf=a=>a.caseSnapshot||resolveCase(round(a),a.caseId);

function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4500)}

function closeModal(){$('#modal').close()}

function transaction(mode,fn){return new Promise((res,rej)=>{const tx=db.transaction('state',mode);let req=fn(tx.objectStore('state'));tx.oncomplete=()=>res(req?.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}

async function init(){try{db=await new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const old=await transaction('readonly',s=>s.get('main'));if(old){validateState(old);state=old}await transaction('readwrite',s=>s.put(state,'main'));seen=state.revision;$('#saveStatus').textContent='Salvo neste navegador'}catch(e){mem=true;$('#saveStatus').textContent='Sessão em memória — faça backup';}render()}

function validateState(s){if(!s||s.schemaVersion!==1||!s.config||!['students','rounds','attempts','imports'].every(k=>Array.isArray(s[k])))throw Error('Backup incompatível');for(const k of ['students','rounds','attempts']){if(s[k].length>10000||s[k].some(v=>!v||typeof v.id!=='string'))throw Error('Registros inválidos')}for(const a of s.attempts)validateAttempt(a)}

function validateAttempt(a){if(!a||typeof a.id!=='string'||typeof a.studentId!=='string'||typeof a.roundId!=='string'||!Array.isArray(a.answers)||a.answers.length!==6||!Array.isArray(a.risks)||a.risks.length!==6||!Number.isInteger(a.revision))throw Error('Tentativa inválida');if(a.caseSnapshot&&(!Number.isInteger(a.caseSnapshot.id)||a.caseSnapshot.id!==a.caseId||typeof a.caseSnapshot.title!=='string'||typeof a.caseSnapshot.body!=='string'||a.caseSnapshot.body.length>200000))throw Error('Narrativa da tentativa inválida');for(const section of a.answers)if(!section||typeof section!=='object'||Array.isArray(section)||Object.values(section).some(v=>typeof v!=='string'||v.length>100000))throw Error('Respostas inválidas');for(const r of a.risks)if(!r||![0,1,2,3,4,5].includes(+r.note)||!['','direct','partial','low'].includes(r.quality)||typeof r.evidence!=='string'||typeof r.reason!=='string')throw Error('Scorecard inválido')}

async function save(){const snapshot=structuredClone(state);$('#saveStatus').textContent=mem?'Sessão em memória — faça backup':'Salvando…';if(mem)return;saveQueue=saveQueue.then(async()=>{try{await new Promise((resolve,reject)=>{const tx=db.transaction('state','readwrite'),s=tx.objectStore('state'),r=s.get('main');r.onsuccess=()=>{if((r.result?.revision||0)>seen){tx.abort();return}snapshot.revision=seen+1;s.put(snapshot,'main')};tx.oncomplete=()=>resolve();tx.onabort=()=>reject(Error('Outra aba gravou dados. Exporte seu backup e reabra antes de continuar.'));tx.onerror=()=>reject(tx.error)});seen=snapshot.revision;state.revision=seen;$('#saveStatus').textContent='Salvo neste navegador · '+new Date().toLocaleTimeString('pt-BR')}catch(e){$('#saveStatus').textContent='Falha ao salvar — exporte backup';toast(e.message)}});return saveQueue}

function chooseStudent(i){if(i&&!confirm('Confirma que você é '+state.students.find(s=>s.id===i).name+'?'))return render();studentId=i;attemptId=null;render()}

function startAttempt(i){const r=state.rounds.find(r=>r.id===i);if(r.status!=='aberta')return toast('Rodada indisponível.');if(state.attempts.filter(a=>a.roundId===i&&a.studentId===studentId).length>=r.limit)return toast('Limite de tentativas alcançado.');newAttempt(r,+$('#case_'+i).value)}

function newAttempt(r,cid){const a={id:id(),studentId,roundId:r.id,caseId:cid,caseSnapshot:cid===0?null:structuredClone(resolveCase(r,cid)),revision:1,rubricVersion:1,answers:Array.from({length:6},()=>({})),risks:CRITERIA.map(()=>({note:0,evidence:'',reason:'',quality:''})),events:[{at:now(),event:'Início da tentativa'}],createdAt:now()};state.attempts.push(a);attemptId=a.id;step=0;view='workspace';save();render()}

function openAttempt(i){attemptId=i;studentId=current().studentId;step=0;go('workspace')}

function writable(a){return !a.submitted&&round(a)?.status==='aberta'}

function stepComplete(a,n){if(n===2)return a.risks.every(r=>r.evidence.trim()&&r.reason.trim()&&r.quality)&&(a.answers[2].priority||'').trim().length>0;return FIELDS[n].every(([k])=>(a.answers[n][k]||'').trim())}

function completion(a){return Math.round(Array.from({length:6},(_,n)=>stepComplete(a,n)).filter(Boolean).length/6*100)}

function workspace(){const a=current();if(!a)return home();const c=caseOf(a),prod=a.caseId>=8||a.caseId===5,locked=!writable(a);return `<div class="row between"><div><div class="eyebrow">${esc(student(a)?.name)} · ${esc(round(a)?.title)}</div><h1>${esc(c?.title||a.answers[0].title||'Projeto livre')}</h1></div><button onclick="go('learner')">Encerrar sessão visual</button></div><div class="layout"><aside class="steps"><div class="card"><b>Seu percurso</b><p>${completion(a)}% de completude</p><div class="bar"><span style="width:${completion(a)}%"></span></div><nav>${LABELS.map((l,i)=>`<button class="${step===i?'active':''}" onclick="changeStep(${i})">${stepComplete(a,i)?'✓':i+1} ${esc(l.split('|')[prod?1:0])}</button>`).join('')}</nav><button onclick="previewPlan()">Prévia do plano</button></div></aside><section><div class="card"><div class="eyebrow">Missão ${step+1} de 6</div><h2>${esc(LABELS[step].split('|')[prod?1:0])}</h2>${locked?'<div class="notice">Consulta: versão entregue ou rodada indisponível para edição.</div>':''}${caseNarrativeHTML(round(a),a.caseId,c)}${step===2?scorecard(a):FIELDS[step].map(([k,l])=>`<label for="f_${k}">${esc(l)}</label><textarea id="f_${k}" ${locked?'disabled':''} oninput="answer('${k}',this.value)">${esc(a.answers[step][k]||'')}</textarea>`).join('')}${step===3?`<details><summary>Matriz de formatos e propriedades</summary><div class="scroll">${markdownTable(MATRIX)}</div></details><details><summary>Simulação antes/depois de conversão</summary><p><b>Original:</b> e-book com navegação, títulos semânticos e links.</p><p><b>Derivado estático:</b> aparência preservada, navegação e semântica não comprovadas. Compare as propriedades; uma imagem não substitui o objeto interativo.</p></details>`:''}${step===4?`<details><summary>Consequências das estratégias</summary><p>Transferência para armazenamento gerenciado reduz exposição ao suporte original, mas requer cópias e verificação. Migração de formato pode alterar propriedades; documente e valide. Emulação pode preservar comportamento, com maior dependência de ambiente. Recuperação forense deve ser planejada antes de intervenções destrutivas.</p><p class="muted">Custos e riscos relativos são ilustrativos. <a href="https://www.dpconline.org/handbook" target="_blank" rel="noopener">DPC Handbook</a></p></details>`:''}${step===5?review(a):''}<div class="row between" style="margin-top:24px"><button ${step===0?'disabled':''} onclick="changeStep(${step-1})">← Anterior</button><button class="primary" ${step===5?'disabled':''} onclick="changeStep(${step+1})">Próxima →</button></div></div></section></div>`}

function markdownTable(t){const rows=t.trim().split('\n').filter(x=>x.startsWith('|')&&!x.includes('|---'));return '<table>'+rows.map((r,i)=>'<tr>'+r.split('|').slice(1,-1).map(c=>`<${i?'td':'th'}>${esc(c.replaceAll('**',''))}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>'}

function answer(k,v){const a=current();if(!writable(a))return;a.answers[step][k]=v;a.revision++;a.updatedAt=now();save()}

async function changeStep(n){const a=current();a.events.push({at:now(),event:'Consultou missão '+(n+1)});await save();step=Math.max(0,Math.min(5,n));render();window.scrollTo(0,0)}

function riskResult(a){const valid=a.risks.every(r=>r.note>=1&&r.note<=5&&r.evidence.trim()&&r.reason.trim()&&r.quality);const confidence=a.risks.some(r=>!r.note||!r.evidence.trim()||!r.reason.trim()||!r.quality||r.quality==='low')?'Baixa':a.risks.every(r=>r.quality==='direct')?'Alta':'Média';const mean=valid?a.risks.reduce((s,r)=>s+ +r.note,0)/6:null;return {mean,confidence,label:mean===null?'Avaliação incompleta: índice global indisponível':mean<2.5?'Baixo a controlado':mean<4?'Elevado':'Muito elevado',alerts:a.risks.map((r,i)=>+r.note===5?i:-1).filter(i=>i>=0)}}

function scorecard(a){const locked=!writable(a);return `<div class="notice">Adaptação didática: risco 1–5. Não é a escala original de Brown nem previsão de vida útil. Desconhecido não equivale a risco 5.</div><details><summary>Conheça o scorecard original de Brown (2008)</summary><p>Seleção de mídias removíveis: adequação de 1 a 3; soma de 6 a 18. Regra geral: total inferior a 12 não deve ser considerado para seleção. Brown atribui a origem conceitual a Bennett (1997). Isso não mede urgência de migração.</p><a href="https://cdn.nationalarchives.gov.uk/documents/information-management/selecting-storage-media.pdf" target="_blank" rel="noopener">Brown (2008), seção 3, p. 6</a></details>${a.caseId>=8||a.caseId===5?'<p class="muted">Produção: critérios aplicados por analogia. DRM, contratos, CDN e serviços são fatores contextuais, não definição de suscetibilidade física.</p>':''}${CRITERIA.map((c,i)=>`<section class="card"><h3>${i+1}. ${c[0]}</h3><details><summary>Descritores de risco e referência</summary><ol>${c.slice(1).map(d=>`<li>${esc(d)}</li>`).join('')}</ol><p class="muted">Descritores próprios do simulador; conceito inspirado em <a href="https://cdn.nationalarchives.gov.uk/documents/information-management/selecting-storage-media.pdf">Brown (2008)</a>.</p></details><label for="rn${i}">Nível de risco</label><select id="rn${i}" ${locked?'disabled':''} onchange="riskEdit(${i},'note',+this.value)"><option value="0">Não foi possível avaliar</option>${c.slice(1).map((d,n)=>`<option value="${n+1}" ${+a.risks[i].note===n+1?'selected':''}>${n+1} — ${esc(d)}</option>`).join('')}</select><label for="re${i}">Evidência do roteiro / fonte consultada</label><textarea id="re${i}" ${locked?'disabled':''} oninput="riskEdit(${i},'evidence',this.value)">${esc(a.risks[i].evidence)}</textarea><label for="rr${i}">Justificativa e providência se faltam informações</label><textarea id="rr${i}" ${locked?'disabled':''} oninput="riskEdit(${i},'reason',this.value)">${esc(a.risks[i].reason)}</textarea><label for="rq${i}">Qualidade da evidência</label><select id="rq${i}" ${locked?'disabled':''} onchange="riskEdit(${i},'quality',this.value)"><option value="">Selecione</option>${[['direct','Direta e verificável'],['partial','Parcial ou indireta'],['low','Insuficiente / não confirmada']].map(([v,l])=>`<option value="${v}" ${a.risks[i].quality===v?'selected':''}>${l}</option>`).join('')}</select></section>`).join('')}<div id="riskSummary">${riskSummary(a)}</div><label for="priority">Problema principal, prioridade institucional e providência justificada</label><textarea id="priority" ${locked?'disabled':''} oninput="answer('priority',this.value)">${esc(a.answers[2].priority||'')}</textarea><label for="order">Modo Priorização: ordem de atendimento dos acervos e justificativa</label><textarea id="order" ${locked?'disabled':''} oninput="answer('order',this.value)">${esc(a.answers[2].order||'')}</textarea><button ${locked?'disabled':''} onclick="counterfactual()">E se uma condição mudar?</button>`}

function riskEdit(i,k,v){const a=current();if(!writable(a))return;a.risks[i][k]=v;a.revision++;a.updatedAt=now();save();$('#riskSummary').innerHTML=riskSummary(a)}

function riskSummary(a){const r=riskResult(a);return `<section class="card"><h3>Perfil de risco técnico</h3>${a.risks.map((x,i)=>`<div class="row between"><span>${CRITERIA[i][0]}</span><b>${x.note||'Não avaliado'}</b></div><div class="bar" role="meter" aria-label="${CRITERIA[i][0]}" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${x.note}"><span style="width:${x.note*20}%"></span></div>`).join('')}<p class="score">${r.mean===null?'—':r.mean.toFixed(2)+'/5'}</p><b>${r.label}</b><p>Confiança no diagnóstico: <b>${r.confidence}</b></p><p class="muted">Pesos iguais e faixas ilustrativas: &lt;2,50; 2,50 a &lt;4; ≥4. Sem validação empírica. Não determina a prioridade institucional.</p>${r.alerts.map(i=>`<div class="notice">${CRITERIA[i][0]} crítico: ${ALERTS[i]} Uma média baixa não cancela este alerta.</div>`).join('')}</section>`}

function counterfactual(){const a=current();dialog(`<h2>E se…?</h2><p>Explore uma hipótese sem substituir as evidências reais. Para revisar a avaliação, volte ao critério e registre a nova evidência.</p><label>Critério<select id="cfcrit">${CRITERIA.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select></label><label>Nota hipotética<input id="cfn" type="number" min="1" max="5" value="5"></label><button onclick="simulateCF()">Simular efeito</button><div id="cfresult"></div><label>Condição, evidência a verificar e gatilho para monitoramento<textarea id="cft"></textarea></label><button class="primary" onclick="saveCF()">Registrar gatilho</button> <button onclick="closeModal()">Fechar</button>`)}

function simulateCF(){const a=structuredClone(current()),i=+$('#cfcrit').value,n=+$('#cfn').value;if(!Number.isInteger(n)||n<1||n>5)return;a.risks[i]={note:n,evidence:'Hipótese ilustrativa',reason:'Contrafactual',quality:'partial'};$('#cfresult').innerHTML='<p>Simulação sem alterar a avaliação:</p>'+riskSummary(a)}

function saveCF(){const a=current(),text=$('#cft').value.trim();if(!text)return toast('Descreva o gatilho.');a.answers[5].triggers=(a.answers[5].triggers||'')+'\nHipótese a verificar: '+text;a.events.push({at:now(),event:'Registrou contrafactual: '+text});a.revision++;save();closeModal();toast('Gatilho registrado na missão 6.')}

function review(a){const done=completion(a);return `<section class="success"><b>${done}% de completude · qualidade argumentativa ainda depende da avaliação docente.</b><p>${Array.from({length:6},(_,n)=>`${stepComplete(a,n)?'✓':'○'} ${NAMES[n]}`).join(' · ')}</p></section><p>Conquistas de percurso: ${stepComplete(a,2)?'🏅 Evidências registradas':'Scorecard em construção'} · ${done===100?'🏅 Plano completo':'Plano em construção'}. Não representam nota homologada.</p><div class="row"><button onclick="previewPlan()">Conferir plano / PDF / Word</button><button onclick="exportAttempt('checkpoint')">Exportar checkpoint</button>${!a.submitted?'<button class="primary" onclick="submitAttempt()">Entregar versão local</button>':'<button onclick="exportAttempt(\'submission\')">Exportar entrega JSON</button>'}</div>${a.evaluation?`<details><summary>Devolutiva docente</summary>${feedbackVisible(a)?`<p>${esc(a.evaluation.feedback)}</p><p>Nota homologada: ${total(a)}/100</p>`:'Disponível após publicação dos resultados.'}</details>`:''}`}

function feedbackVisible(a){return round(a)?.feedbackPolicy!=='publicacao'||round(a)?.status==='publicada'}

function submitAttempt(){const a=current();if(!writable(a))return;if(completion(a)<100)return toast('Revise os campos pendentes nas seis missões. É permitido registrar lacunas justificadas no scorecard.');if(!confirm('Congelar esta versão local para entrega? Você poderá consultar e exportar o plano.'))return;a.submitted=true;a.submittedAt=now();a.events.push({at:now(),event:'Entrega local congelada'});a.revision++;save();render();toast('Versão salva localmente. Em outro aparelho, exporte a entrega JSON e encaminhe ao professor.')}

function planSections(a){const rr=riskResult(a),s=student(a),r=round(a);let sections=[['Identificação',`Aluno(a): ${s?.name||'Não informado'}\nProfessor(a): ${state.config.teacher||'Não informado'}\nInstituição / curso / turma: ${[state.config.institution,state.config.course,state.config.className].filter(Boolean).join(' / ')}\nRodada: ${r?.title||''}\nCaso: ${caseOf(a)?.title||'Projeto livre'}\nData: ${a.submittedAt||a.updatedAt||a.createdAt}\nSituação: ${a.submitted?'Versão entregue':'Rascunho'}`]];const narrative=caseOf(a);if(narrative)sections.push(['Narrativa do caso utilizado',narrative.title+'\n\n'+narrative.body.replaceAll('**','').replaceAll('*','')]);for(let n=0;n<6;n++){if(n===2){sections.push(['3. Avaliação de riscos',a.risks.map((x,i)=>`${CRITERIA[i][0]}: ${x.note||'Não avaliado'}\nEvidência: ${x.evidence||'Não registrada'}\nJustificativa: ${x.reason||'Não registrada'}\nQualidade: ${{direct:'Direta e verificável',partial:'Parcial ou indireta',low:'Insuficiente / não confirmada'}[x.quality]||'Não informada'}`).join('\n\n')+`\n\nÍndice: ${rr.mean===null?'Indisponível':rr.mean.toFixed(2)+'/5'}; ${rr.label}. Confiança: ${rr.confidence}.\nAlertas: ${rr.alerts.map(i=>CRITERIA[i][0]+': '+ALERTS[i]).join('; ')||'Nenhuma nota crítica registrada'}\nPrioridade: ${a.answers[2].priority||'Não informada'}\nOrdem de atendimento: ${a.answers[2].order||'Não informada'}`]);}else sections.push([`${n+1}. ${NAMES[n]}`,FIELDS[n].map(([k,l])=>l+'\n'+(a.answers[n][k]||'Não informado')).join('\n\n')])}sections.push(['Declaração metodológica','Instrumento didático inspirado em Brown (2008). Original: seleção de mídias, adequação 1–3, soma 6–18, limiar geral 12. Adaptação: risco 1–5, pesos iguais, evidências e confiança independente. Faixas ilustrativas não validadas; não prediz falha nem determina migração imediata. Bennett (1997) é citado por Brown e não foi consultado diretamente.']);sections.push(['Referências',REFS.replace(/^## .*\n/,'')]);return sections}

function planHTML(a){return '<article class="plan"><h1>Plano de Preservação Digital</h1>'+planSections(a).map(([h,p])=>`<h2>${esc(h)}</h2><p>${esc(p)}</p>`).join('')+'</article>'}

function previewPlan(i){if(i)attemptId=i;const a=current();dialog(`<div class="noprint"><h2>Conferência do plano</h2><p>Confira os dados antes de baixar. PDF: escolha “Salvar como PDF” no diálogo de impressão.</p><div class="row"><button class="primary" onclick="window.print()">Salvar em PDF</button><button onclick="word()">Baixar Word (.docx)</button><button onclick="downloadText()">Baixar texto</button><button onclick="closeModal()">Fechar</button></div><hr></div>${planHTML(a)}`)}

function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}

function safeName(s){return String(s||'plano').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,80)}

function downloadText(){const a=current();download(new Blob([planSections(a).map(x=>x.join('\n')).join('\n\n')],{type:'text/plain;charset=utf-8'}),safeName(student(a)?.name)+'_plano.txt')}

function crc32(b){let c=0xffffffff;for(const x of b)c=CRC[(c^x)&255]^(c>>>8);return(c^0xffffffff)>>>0}

function word(){const a=current();download(docxBlob(a),safeName(student(a)?.name)+'_'+safeName(round(a)?.title)+'_plano.docx')}

function total(a){return a.evaluation?.scores?.reduce((s,v)=>s+v,0)||0}

function pkg(type,payload,meta={}){return {appId:APP,schemaVersion:1,packageId:id(),exportedAt:now(),type,rubricVersion:1,...meta,payload}}

function jsonDownload(p,name){download(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),safeName(name)+'.json')}

function exportAttempt(type){const a=structuredClone(current());delete a.evaluation;delete a.evaluationHistory;if(type==='submission'&&!a.submitted)return toast('Entregue a versão local primeiro.');jsonDownload(pkg(type,{attempt:a},{roundId:a.roundId,studentId:a.studentId,attemptId:a.id,revision:a.revision}),student(a)?.alias+'_'+type)}

function selectFile(accept,fn){const f=$('#file');f.accept=accept;f.value='';f.onchange=async()=>{try{const file=f.files[0];if(!file)return;if(file.size>10*1024*1024)throw Error('Limite de arquivo: 10 MB');await fn(await file.text())}catch(e){toast('Arquivo recusado: '+e.message)}};f.click()}

function guideHTML(g,title){const num=++guideCounter,id='field-guide-'+num;return {id,html:`<details id="${id}" class="field-guide"><summary aria-label="Como preencher: ${esc(title)}">ⓘ Como preencher · exemplo e fundamento</summary><div class="guide-body"><p><b>O que registrar:</b> ${esc(g.instruction)}</p><div class="guide-example"><b>${g.caseExample?'Exemplo ilustrativo para este caso':'Exemplo de preenchimento'}:</b><p>${esc(g.example)}</p></div><p class="muted">${g.caseExample?'Exemplo fictício de estudo; pode incluir premissas adicionais explicitadas, ausentes no roteiro. Adapte à evidência disponível.':'Adapte o exemplo à sua situação; não é resposta obrigatória.'} A ajuda não preenche nem altera sua resposta.</p>${g.operational?'<p class="muted"><b>Configuração de uso do simulador:</b> o material de apoio não prescreve este cadastro, limite ou regra de jogo.</p>':''}${g.module?`<p><b>Onde estudar:</b> <a href="${SUPPORT_URL}#modulo-${g.module}" target="_blank" rel="noopener">Silva (2026) — módulo ${g.module}</a>. Procure: <b>${esc(g.location)}</b>. O link abre o módulo; o subtópico é indicado para localização na página.</p>`:'<p class="muted">Campo operacional: não exige fundamentação teórica. Para compreender o conteúdo da simulação, consulte os módulos do material de apoio no guia de estudo.</p>'}${g.score?'<p class="notice">O material de Silva fundamenta os conceitos relacionados; não estabelece a escala, os pesos ou os limiares deste scorecard. Estes são convenções didáticas do simulador. Referencial específico: <a href="https://cdn.nationalarchives.gov.uk/documents/information-management/selecting-storage-media.pdf" target="_blank" rel="noopener">Brown (2008), seção 3, p. 6</a>, que utiliza adequação 1–3 para seleção de mídias.</p>':''}<p class="muted">As instruções estão incorporadas ao HTML e funcionam offline. Consultar o recurso externo requer internet.</p></div></details>`}}

function decorateFields(root){if(!root)return;for(const el of root.querySelectorAll('input:not([type=file]):not([type=checkbox]),select,textarea')){if(el.dataset.guideReady)continue;const g=guideData(el);if(!g)continue;el.dataset.guideReady='1';const labelNode=el.labels?.[0]?.cloneNode(true);if(labelNode)labelNode.querySelectorAll('input,textarea,select').forEach(n=>n.remove());const label=(labelNode?.textContent||el.getAttribute('aria-label')||el.id).trim();const panel=guideHTML(g,label);const parentLabel=el.closest('label');(parentLabel||el).insertAdjacentHTML('afterend',panel.html);el.setAttribute('aria-describedby',[el.getAttribute('aria-describedby'),panel.id].filter(Boolean).join(' '));}
 for(const [name,g] of Object.entries({rc:{instruction:'Selecione um ou mais casos para a rodada. Casos diferentes geram rankings separados; alinhe a escolha ao objetivo e à tipologia.',example:'Uma rodada com Caso 4 para toda a turma permite discutir as mesmas condições de história oral.',operational:true,module:4,location:'4 — Aplicação por Tipologia'},rs:{instruction:'Marque os alunos já cadastrados que participarão. Confira os identificadores dos homônimos. Somente inscritos podem importar entregas da rodada.',example:'Selecionar Ana · TURMA-01 e João · TURMA-02; desmarcar quem não participa.',operational:true}})){const controls=[...root.querySelectorAll(`input[name="${name}"]`)];if(controls.length&&!controls[0].dataset.guideReady){controls.forEach(x=>x.dataset.guideReady='1');const panel=guideHTML(g,name==='rc'?'Casos disponíveis':'Participantes');controls[controls.length-1].closest('label').insertAdjacentHTML('afterend',panel.html);controls.forEach(x=>x.setAttribute('aria-describedby',panel.id));}}
}

function studyGuide(){return `<details class="study-guide"><summary>📖 Guia de preenchimento e material de apoio</summary><p>Cada campo tem uma ajuda expansível com instrução, exemplo e base conceitual. Antes de responder, diferencie o que o caso informa, o que você propõe e o que ainda precisa investigar. Não invente evidências para completar o formulário.</p><p>${esc(SUPPORT_CITATION)}</p><ul>${[[1,'Fundamentos','1.1 — camadas física, lógica e conceitual; 1.2 — autenticidade, fidedignidade, integridade e fixidez'],[2,'Requisitos','2.1 — limites, conteúdo, apresentação, funcionalidade e contexto; 2.2 — política e princípios'],[3,'Estratégias','3.1 — governança, custos e direitos; 3.2 — migração, emulação e recuperação; 3.3 — decisão contextual'],[4,'Tipologias','tabela de formatos master, disseminação e estratégias por conteúdo'],[5,'OAIS e padrões','5.1 — funções, pacotes e comunidade designada; 5.2 — PREMIS/METS; 5.3 — RODA/LOCKSS']].map(([n,t,d])=>`<li><a href="${SUPPORT_URL}#modulo-${n}" target="_blank" rel="noopener">Módulo ${n} — ${t}</a>: ${d}.</li>`).join('')}</ul><p class="muted">Referência de apoio aos conceitos, sem equivalência entre o modelo OAIS e esta aplicação local. Regras de formulário, gamificação e scorecard adaptado são escolhas do simulador.</p></details>`}
