function guideData(el){
 const key=el.id||'',a=current(),ex=FIELD_EXAMPLES[a?.caseId];
 if(key.startsWith('f_')||['priority','order'].includes(key)){
  const k=key.startsWith('f_')?key.slice(2):key,g=FIELD_GUIDES[k];if(!g)return null;
  const caseExample=ex?.answers?.find(section=>typeof section[k]==='string')?.[k]||null;
  return {instruction:g[0],example:caseExample||g[1],module:g[2],location:g[3],caseExample:!!caseExample,kind:'concept'};
 }
 const risk=key.match(/^r([neqr])(\d+)$/);
 if(risk){const i=+risk[2],criterion=CRITERIA[i]?.[0],gtype=risk[1];if(!criterion)return null;
 const defs=['Conservação e estabilidade do suporte/ambiente, sem estimar anos não documentados.','Adequação do espaço ao volume, crescimento e versões do conjunto.','Condições de leitura, verificação de integridade e recuperação conforme a adaptação do simulador.','Disponibilidade de leitores, programas, especificações e ambientes para interpretar o conteúdo.','Sustentabilidade de manutenção, infraestrutura e licenças diante dos recursos disponíveis.','Exposição física da infraestrutura ou suporte a dano e condições adversas; DRM/CDN não redefinem este critério.'];
 const entry=ex?.risks[i],short=entry?`${entry.note?`Nota ${entry.note}`:'Não foi possível avaliar'}. ${entry.evidence}`:'Não foi possível avaliar: disponibilidade de leitor ainda não documentada; verificar antes de atribuir nota.';
 const instructions={n:`Em ${criterion.toLowerCase()}, avalie: ${defs[i]} Selecione 1–5 pelo descritor e pela evidência, ou “Não foi possível avaliar”. Não use nota 5 para ausência de informação.`,e:'Transcreva ou resuma a observação que sustenta a avaliação e identifique sua origem. Se não existir no roteiro, registre a lacuna. Hipóteses adicionais devem ser rotuladas como fictícias.',r:'Explique a relação entre observação e descritor; quando faltar informação, diga o que obter e como. Nota alta não é automaticamente ordem de migração.',q:'Direta/verificável: observação ou documento identificável. Parcial/indireta: inferência ou evidência limitada. Insuficiente: informação não confirmada. A confiança é independente do índice de risco.'};
 return {instruction:instructions[gtype],example:gtype==='e'?(entry?.evidence||short):gtype==='r'?(entry?.reason||'Sem levantamento da disponibilidade de leitores, não atribuir nota; solicitar diagnóstico complementar.'):gtype==='q'?'Se a condição não está documentada, registre insuficiente/não confirmada; não a apresente como medição realizada.':short,module:i===4?3:i===1?5:1,location:i===4?'3.1 — Gestão de Custos':i===1?'5.1 — Armazenamento Arquivístico':'1.1 — Camadas do Objeto; 1.2 — Integridade e Custódia',caseExample:!!entry,score:true};
 }
 if(ADMIN_GUIDES[key]){const g=ADMIN_GUIDES[key];return{instruction:g[0],example:g[1],operational:true,module:['ri','ro','gfeedback','greason'].includes(key)?2:null,location:'2.2 — Princípios e política: apoio conceitual à tarefa, não regra do formulário'}}
 if(key.startsWith('case_'))return{instruction:'Escolha um caso dentre os autorizados nesta rodada. Leia o roteiro antes de iniciar; cada caso tem contexto e propriedades diferentes.',example:'Escolha história oral para investigar acesso ao áudio e preservação de contexto.',operational:true,module:4,location:'4 — Aplicação por Tipologia de Conteúdo Digital'};
 return null;
}

function dialog(html){$('#modal').innerHTML=html;$('#modal').showModal();decorateFields($('#modal'))}
function go(v){view=['home','learner','workspace','ranking'].includes(v)?v:'home';render();window.scrollTo(0,0)}
function render(){const app=$('#app');app.innerHTML=studyGuide()+({home:home,learner:learner,workspace:workspace,ranking:rankings}[view]||home)();decorateFields(app)}
function home(){return `<section class="hero"><div class="eyebrow">Portal exclusivo do aluno</div><h1>Seu plano de preservação<br>começa com uma boa pergunta.</h1><p>Importe o pacote individual recebido, realize as seis missões e fundamente suas decisões. Seu trabalho fica salvo neste navegador.</p><button class="primary" onclick="importFile()">Importar minha participação</button> <button onclick="go('learner')">Retomar minhas missões</button></section><div class="grid"><section class="card"><h2>Como começar</h2><ol><li>Receba do professor o arquivo individual de participação JSON.</li><li>Importe-o aqui e confira nome e rodada.</li><li>Complete as missões com a ajuda de preenchimento de cada campo.</li><li>Confira o plano, salve PDF/Word e exporte a entrega JSON.</li><li>Encaminhe os arquivos pelo canal combinado.</li></ol></section><section class="card"><h2>Seu espaço de estudo</h2><p>Consulte exemplos, explicações e referências. Você pode guardar seu backup pessoal e importar a devolutiva e os resultados recebidos.</p><div class="row"><button onclick="exportBackup()">Baixar meu backup</button><button onclick="importFile()">Importar arquivo pessoal</button><button onclick="go('ranking')">Ver resultados recebidos</button></div></section></div><div class="notice">${mem?'Armazenamento indisponível: baixe um backup antes de fechar.':'Dados disponíveis apenas neste navegador.'} Este portal não envia respostas automaticamente. Link e código de rodada não substituem o pacote individual.</div>`}
function learner(){return `<div class="eyebrow">Minhas atividades</div><h1>Meu percurso de preservação</h1><div class="row"><button class="primary" onclick="importFile()">Importar participação / devolutiva</button><button onclick="exportBackup()">Meu backup</button><button onclick="go('ranking')">Resultados recebidos</button></div>${!state.students.length?'<section class="card" style="margin-top:22px"><h2>Importe sua participação para iniciar</h2><p>Solicite ao professor seu arquivo individual JSON. Este portal não cadastra alunos nem cria rodadas.</p></section>':`<section class="card" style="margin-top:22px"><label for="identity">Confirme seu cadastro</label><select id="identity" onchange="chooseStudent(this.value)"><option value="">Selecione seu cadastro importado</option>${state.students.map(s=>`<option value="${s.id}" ${studentId===s.id?'selected':''}>${esc(s.name)} · ${esc(s.registration||s.id.slice(0,8))}</option>`).join('')}</select></section>`}${studentId?state.rounds.filter(r=>r.students.includes(studentId)).map(r=>`<section class="card"><span class="tag">${esc(r.status)}</span><h2>${esc(r.title)}</h2><p>${esc(r.instructions)}</p><p class="muted">Objetivo: ${esc(r.objectives)} · Prazo indicativo: ${esc(r.deadline||'a combinar')}</p>${state.attempts.filter(a=>a.roundId===r.id&&a.studentId===studentId).map(a=>`<p><button onclick="openAttempt('${a.id}')">${a.submitted?'Consultar entrega':'Retomar missão'} · ${esc(caseOf(a)?.title||'Projeto livre')}</button> ${completion(a)}% de completude</p>`).join('')}${r.status==='aberta'?`<label for="case_${r.id}">Caso da rodada</label><select id="case_${r.id}" onchange="showRoundCase('${r.id}',this.value)">${r.cases.map(cid=>`<option value="${cid}">${cid===0?'Projeto livre':esc(resolveCase(r,cid)?.title)}</option>`).join('')}</select><div id="caseNarrative_${r.id}">${caseNarrativeHTML(r,r.cases[0])}</div><p><button class="primary" onclick="startAttempt('${r.id}')">Iniciar tentativa</button></p>`:''}<p class="muted">Condições recebidas no pacote. Sem atualização remota automática.</p></section>`).join(''):''}`}
function help(){dialog(`<h2>Orientações do aluno</h2><ol><li>Importe sua participação e confirme o nome.</li><li>Realize as seis missões; use “Como preencher” para consultar instruções, exemplos e fundamentos.</li><li>Revise as pendências. Desconhecido no scorecard não equivale a risco 5.</li><li>Na prévia, salve o plano em PDF pelo diálogo de impressão ou baixe Word.</li><li>Entregue a versão local e exporte o JSON de entrega para encaminhar ao professor.</li><li>Importe devolutiva e resultados que receber.</li></ol><p>O backup deste portal é pessoal e não é o arquivo de entrega. Ele serve para retomar seu trabalho no portal do aluno.</p><div class="notice">A aplicação não tem funções de gestão docente. Seus dados continuam editáveis por quem controla este navegador; não há autenticação remota.</div><button onclick="exportBackup()">Meu backup</button> <button onclick="closeModal()">Fechar</button>${studyGuide()}`)}
function sources(){dialog(`<h2>Fontes e conceitos</h2><div class="casebody">${esc(REFS)}</div>${studyGuide()}<button onclick="closeModal()">Fechar</button>`)}
function rankings(){return `<button onclick="go('learner')">Minhas missões</button><h1>Resultados recebidos</h1><p class="muted">Resultados publicados e enviados pelo professor. Não há atualização automática; notas locais não têm proteção contra alteração por quem controla o navegador.</p>${state.rounds.filter(r=>r.published).map(r=>`<section class="card"><h2>${esc(r.title)}</h2><p>Publicação recebida · versão ${r.published.version}</p>${r.published.visibility==='privado'?'<p>Consulte sua devolutiva individual.</p>':r.published.groups.map(g=>`<h3>${esc(CASES.find(c=>c.id===g.caseId)?.title||'Projeto livre')}</h3>${r.published.visibility==='cooperativo'?`<p>Conclusão coletiva: ${g.entries.length} participantes, sem pódio.</p>`:`<div class="grid">${g.entries.filter(e=>e.position<=3).map(e=>`<div class="success"><b>${e.position===1?'🏆 Campeão(ã)':e.position+'º lugar'}</b><h3>${esc(e.alias)}</h3>${e.total}/100</div>`).join('')}</div><table><tr><th>Posição</th><th>Apelido</th><th>Nota</th></tr>${g.entries.map(e=>`<tr><td>${e.position}</td><td>${esc(e.alias)}</td><td>${e.total}</td></tr>`).join('')}</table>`}`).join('')}</section>`).join('')||'<section class="card">Ainda não há resultados importados.</section>'}`}
function cleanParticipation(p){const {round:r,student:s}=p.payload;const rr={};for(const k of ['id','title','instructions','objectives','deadline','limit','visibility','feedbackPolicy','cases','status','code','rubricVersion','rankingVersion','caseNarratives'])if(r[k]!==undefined)rr[k]=structuredClone(r[k]);rr.students=[s.id];const ss={};for(const k of ['id','name','alias','registration'])if(s[k]!==undefined)ss[k]=s[k];const cfg={};for(const k of ['teacher','institution','course','className'])cfg[k]=String(p.payload.config?.[k]||'');return {round:rr,student:ss,config:cfg}}
function validatePackage(p){if(p?.type==='participation')validateNarratives(p.payload?.round);if(!p||p.appId!==APP||p.schemaVersion!==1||p.rubricVersion!==1||typeof p.packageId!=='string'||!p.payload)throw Error('Formato incompatível');if(!['participation','feedback','ranking','student-backup'].includes(p.type))throw Error('Este portal aceita somente participação individual, devolutiva, resultados e backup pessoal do aluno. Não importe backup de turma.');if(p.type==='student-backup'){validateStudentBackup(p.payload);return}if(typeof p.roundId!=='string')throw Error('Identificação de rodada ausente');if(p.type==='participation'){const {round:r,student:s,config}=p.payload;if(!r||!s||r.id!==p.roundId||s.id!==p.studentId||typeof s.name!=='string'||!s.name.trim()||typeof s.alias!=='string'||!Array.isArray(r.students)||r.students.length!==1||r.students[0]!==s.id||!Array.isArray(r.cases)||!r.cases.length||!r.cases.every(n=>Number.isInteger(n)&&n>=0&&n<=11)||!Number.isInteger(r.limit)||r.limit<1||r.limit>10||!['rascunho','aberta','pausada','encerrada','publicada'].includes(r.status)||r.rubricVersion!==1||typeof r.title!=='string'||typeof r.instructions!=='string')throw Error('Participação individual inválida');if(config&&typeof config!=='object')throw Error('Cabeçalho inválido')}
 if(p.type==='feedback'){const e=p.payload.evaluation;if(!e||!Array.isArray(e.scores)||e.scores.length!==6||e.scores.some((v,i)=>typeof v!=='number'||!Number.isFinite(v)||v<0||v>MAX[i])||typeof e.feedback!=='string'||typeof e.at!=='string')throw Error('Devolutiva inválida')}
 if(p.type==='ranking'){const r=p.payload.published;if(!r||!Number.isInteger(r.version)||r.version<1||!['ranking','privado','cooperativo'].includes(r.visibility)||!Array.isArray(r.groups)||r.groups.length>12||r.groups.some(g=>!Number.isInteger(g.caseId)||!Array.isArray(g.entries)||g.entries.length>10000||g.entries.some(e=>typeof e.alias!=='string'||!Number.isInteger(e.position)||e.position<1||!Number.isFinite(e.total)||e.total<0||e.total>100)))throw Error('Resultados inválidos')}}
function validateStudentBackup(s){validateState(s);if(s.portal!=='student'||s.students.length>1)throw Error('Backup não pertence a este portal pessoal');const ids=new Set(s.students.map(x=>x.id));for(const r of s.rounds){if(!Array.isArray(r.students)||r.students.some(i=>!ids.has(i)))throw Error('Backup contém outro participante')}for(const a of s.attempts)if(!ids.has(a.studentId)||!s.rounds.some(r=>r.id===a.roundId))throw Error('Tentativa de outro participante')}
function applyPackage(p){validatePackage(p);if(state.imports.includes(p.packageId))throw Error('Pacote já importado');if(p.type==='student-backup'){state=structuredClone(p.payload);delete state.portal;state.revision=seen;studentId=state.students[0]?.id||null;attemptId=null;view='learner'}else if(p.type==='participation'){const safe=cleanParticipation(p),r=safe.round,s=safe.student;if(state.students.length&&state.students[0].id!==s.id)throw Error('Este navegador já tem outro aluno. Use outro perfil ou navegador para a nova pessoa; os registros existentes foram preservados.');const old=state.rounds.find(x=>x.id===r.id);if(old){if(!r.caseNarratives||JSON.stringify(old.cases)!==JSON.stringify(r.cases))throw Error('Participação já cadastrada ou seleção de casos diferente; registros existentes preservados');for(const c of r.caseNarratives){const previous=resolveCase(old,c.id);if(previous&&(previous.title!==c.title||previous.body!==c.body))throw Error('A narrativa mudou em relação à atividade já cadastrada. Confirme com o professor antes de trocar de caso.')}for(const a of state.attempts.filter(a=>a.roundId===old.id)){if(!a.caseSnapshot&&a.caseId!==0)a.caseSnapshot=structuredClone(resolveCase(old,a.caseId))}old.caseNarratives=structuredClone(r.caseNarratives);studentId=s.id;view='learner'}else{if(!state.students.length)state.students.push(s);state.rounds.push(r);state.config=safe.config;studentId=s.id;view='learner'}}else if(p.type==='feedback'){const a=state.attempts.find(a=>a.id===p.attemptId&&a.studentId===p.studentId&&a.roundId===p.roundId);if(!a||a.revision!==p.revision)throw Error('Devolutiva não corresponde à sua tentativa/versão');if(a.evaluation&&a.evaluation.at>=p.payload.evaluation.at)throw Error('Devolutiva antiga');a.evaluation={scores:p.payload.evaluation.scores.slice(),feedback:p.payload.evaluation.feedback,at:p.payload.evaluation.at,rubricVersion:1};if(round(a)?.feedbackPolicy==='publicacao')toast('Devolutiva recebida; ficará visível quando importar os resultados publicados.')}else if(p.type==='ranking'){const r=state.rounds.find(r=>r.id===p.roundId);if(!r)throw Error('Importe primeiro sua participação nesta rodada');if(r.published?.version>=p.payload.published.version)throw Error('Resultados antigos ou já importados');r.published={version:p.payload.published.version,at:String(p.payload.published.at||''),visibility:p.payload.published.visibility,groups:p.payload.published.groups.map(g=>({caseId:g.caseId,entries:g.entries.map(e=>({alias:e.alias,position:e.position,total:e.total,caseId:g.caseId}))}))};r.status='publicada';view='ranking'}state.imports.push(p.packageId)}
function importFile(){selectFile('.json',async text=>{const p=JSON.parse(text,(k,v)=>{if(['__proto__','constructor','prototype'].includes(k))throw Error('Chave não permitida');return v});validatePackage(p);dialog(`<h2>Conferir arquivo recebido</h2><p>Tipo: ${esc(p.type)} · ${esc(p.payload.student?.name||p.payload.title||'Dados do aluno')}</p><p>${esc(p.payload.round?.title||'')}</p>${p.type==='student-backup'?'<div class="notice">Restaurar este backup pessoal substituirá seus registros neste portal. Baixe o backup atual antes.</div>':'<p>Confira se este é seu pacote e sua rodada.</p>'}<button class="primary" id="confirmImport">Confirmar importação</button> <button onclick="closeModal()">Cancelar</button>`);$('#confirmImport').onclick=()=>{try{applyPackage(p);closeModal();save();render();toast('Arquivo importado neste portal.')}catch(e){toast(e.message)}}})}
function exportBackup(){const data=structuredClone(state);data.portal='student';jsonDownload(pkg('student-backup',data),'preserva_meu_backup')}
// Link opcional pode transportar apenas participação individual, nunca respostas ou dados da turma.
// Sem pacote embutido: a importação explícita evita publicar identificações em endereços.

function resolveCase(r,cid){return r?.caseNarratives?.find(c=>c.id===+cid)||CASES.find(c=>c.id===+cid)}
function validateNarratives(r){if(!r||r.caseNarratives===undefined)return;if(!Array.isArray(r.caseNarratives)||r.caseNarratives.length>11||!Array.isArray(r.cases))throw Error('Narrativas inválidas');const required=r.cases.filter(i=>i!==0),ids=new Set();for(const c of r.caseNarratives){if(!c||!Number.isInteger(c.id)||!required.includes(c.id)||ids.has(c.id)||typeof c.title!=='string'||!c.title.trim()||c.title.length>500||typeof c.body!=='string'||!c.body.trim()||c.body.length>200000)throw Error('Narrativa ausente, duplicada ou incompatível com os casos da rodada');ids.add(c.id)}if(required.some(i=>!ids.has(i)))throw Error('Falta narrativa de caso selecionado')}
function makeCaseNarratives(r){return r.cases.filter(i=>i!==0).map(cid=>{const c=resolveCase(r,cid);if(!c)throw Error('Caso sem narrativa disponível');return{id:c.id,title:c.title,body:c.body,narrativeVersion:c.narrativeVersion||1,source:c.source||'Banco de casos didáticos do Simulador de Planos de Preservação Digital',packagedAt:now()}})}
function caseNarrativeHTML(r,cid,c){c=c||resolveCase(r,cid);if(!c)return '<div class="notice">Projeto livre: descreva seu objeto e contexto na missão 1. Esta modalidade não tem roteiro pronto.</div>';const key=r.id+':'+cid,open=state.narrativeViews?.[key]!==false,packaged=!!r.caseNarratives?.some(x=>x.id===+cid);return `<details class="case-narrative" ${open?'open':''} ontoggle="rememberNarrative('${esc(r.id)}',${+cid},this.open)"><summary><span>📖 Caso ${esc(cid)} — ${esc(c.title)}</span><span class="narrative-control"><span class="when-open">Recolher caso ▲</span><span class="when-closed">Mostrar caso ▼</span></span></summary><div class="narrative-text"><p class="muted">Roteiro didático adaptado à disciplina. Instituição e personagens fictícios; não é o relato do caso-fonte. Leia o contexto antes de construir seu plano.</p>${c.body.replaceAll('**','').replaceAll('*','').split(/\n+/).filter(Boolean).map(line=>`<p>${esc(line)}</p>`).join('')}<p class="muted">${packaged?'Narrativa recebida no pacote individual de participação.':'Pacote anterior ou estudo local: narrativa consultada no banco incorporado a este HTML.'} Dados ausentes devem ser reconhecidos como lacunas; não invente evidências.</p></div></details>`}
function showRoundCase(ri,cid){const r=state.rounds.find(x=>x.id===ri),el=document.getElementById('caseNarrative_'+ri);if(r&&el)el.innerHTML=caseNarrativeHTML(r,+cid)}
function rememberNarrative(ri,cid,open){const key=ri+':'+cid;state.narrativeViews=state.narrativeViews||{};if((state.narrativeViews[key]!==false)===open)return;state.narrativeViews[key]=open;save()}

window.addEventListener('beforeunload',e=>{if($('#saveStatus')?.textContent==='Salvando…'){e.preventDefault();e.returnValue='Aguarde o salvamento.'}});
init();
